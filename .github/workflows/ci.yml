name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - name: Verify
        env:
          AGENT_KIT_BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}
        run: scripts/verify
