name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - name: Verify
        env:
          AGENT_KIT_BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}
        run: scripts/verify
  windows:
    # The POSIX suite drives shell-script fakes; Windows runs its own tests.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest tests/test_windows.py -q -p no:cacheprovider
